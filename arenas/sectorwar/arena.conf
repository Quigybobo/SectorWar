; SectorWar arena — base settings extracted from a live SSCJ Devastation arena
; (1777502577 timestamp via Beyond-SectorWar's SS spectator dump tool, 2026-04).
;
; Treat settings.conf as a starting point to customize, not as the final word.
; Per BA Law 17, ASSS SVS is the canonical reference for *base* values — this
; dump exists to seed gameplay feel, not to define what Subspace ships "should" be.

; Pull in the standard SVS baseline first so we have all the infrastructure
; settings ([Door], [Toggle], [Routing], etc.) that the Devastation dump
; doesn't include.
#include conf/svs/svs.conf

; Now layer the Devastation gameplay tuning on top.
#include settings.conf

; Slice 4: per-ship per-player floor values (Hyperspace upgrade-model spine).
; ShipSettings module reads [Warbird.Floor], [Javelin.Floor], etc. from this file.
#include floor.conf

; Static-turret type registry used by the Pylon + StationDeployer subsystems.
; Defines [staticturret_pylon], [staticturret_outpost_gun], etc. Without this
; include, AddBot("pylon", ...) returns UnknownType and ?buypylon refunds.
#include structures.conf

[General]
; Placeholder map until we ship a custom one.
Map = smallmape.lvl
DesiredPlaying = 8
; Set by quigybobo with ?quickfix on 5/2/2026 6:09:59 PM
MaxPlaying = 0
; Factorio-themed LVZ proof of concept + per-player capital ship overlay pool.
; Object IDs 5000..5004 = hull rings (demo), 5005 = static capital, 6000..6063 = player pool.
; Generated by tools/lvz_warbird_capital.py.
; Filename kept short - Continuum's level-files packet caps at 16 chars per name.
LevelFiles = sectorwar.lvz
; swturrets.lvz holds rotation frames for outpost_gun + outpost_frigate
; cannons (kept out of sectorwar.lvz to stay under the 256 KB per-file
; cap). Continuum unifies image indices across all loaded files —
; swturrets.lvz's images start at global index 188.
LevelFiles1 = swturrets.lvz

[Modules]
; Minimal scoring + a soft cap on ship-flipping + the SectorWar umbrella.
; The umbrella aggregates 28 gameplay subsystems via partial-class files —
; one attach line gives you all of them. See conf/Modules.config.
AttachModules = \
	SS.Core.Modules.Scoring.KillPoints \
	SS.Core.Modules.Enforcers.ShipChange \
	SS.SectorWar.Modules.SectorWar

[Misc]
GreetMessage = Welcome to SectorWar. Custom zone in development.
SeeEnergy = Team
SpecSeeEnergy = All
; Set by quigybobo with ?quickfix on 5/2/2026 6:09:59 PM
MaxResArea = 0

[SectorWar]
; Slice 2 — XP and levels.
XpPerKill = 100
XpPerGreen = 5
; XP needed to reach level N is BaseXpForLevel * (N-1)^2.
; baseXp=250 → level 2 at 250 XP, level 3 at 1000, level 4 at 2250.
BaseXpForLevel = 250

; Slice 5 — credits + first money sink (transfer fee).
CreditsPerKill = 50
CreditsPerGreen = 2
; Percent of transfer amount paid as fee. Fee vanishes from the economy (sink).
TransferFeePercent = 5

; Slice 7 — wealth tax (sink #3). Every MoneySinksWealthTaxIntervalSeconds,
; players with credits over threshold pay MoneySinksWealthTaxPercent of the
; EXCESS into the jackpot pool. Keys live under [SectorWar] with a MoneySinks
; prefix per the umbrella's consolidated-conf convention.
MoneySinksWealthTaxIntervalSeconds = 3600
MoneySinksWealthTaxPercent = 1
MoneySinksWealthTaxThresholdCredits = 1000000

; GunTurret auto-fire — only consulted by Auto Cannon / Auto Bomb Pod
; items (IDs 5021-5024 / 5031-5034). Slave-fire turrets ignore these.
GunTurretAutoFireSightPixels = 480
GunTurretAutoFireDelayMs = 500
GunTurretAnchorPriorityWindowMs = 500

; HQ subsystem — auto-spawn per-team headquarters at arena Create.
; Two HQs: freq 0 at the [Spawn] Team0-X/Y coord (left base), freq 1 at
; Team1-X/Y (right). Each has 4 perimeter guns + 1 command core + 1
; patrolling capital that warps among 4 corners. Set HqEnabled=0 to
; disable the entire HQ system.
HqEnabled = 1
; Capital teleports every ~10s (jittered ±20%) when no enemy is in
; engage-hold range. Lower = more frenetic patrol; higher = static.
HqCapitalPatrolPeriodMs = 10000
; Any enemy player within this radius of the capital pauses its patrol
; (capital holds position so StaticTurret AI can engage). 1024 px = 64 tiles.
HqCapitalEngageHoldPixels = 1024
; After a capital is killed, wait this many seconds before respawning at
; HQ center (corner 0).
HqCapitalRespawnDelaySeconds = 60

; AutoBrick — centerline wall at x=512 enforcing the left-vs-right split.
; Two bricks with a midfield breach (y=496..528) so teams can push through
; center. AutoBrick refreshes both every [Brick] BrickTime, creating a
; "permanent" wall. Keys live under [SectorWar] with the AutoBrick prefix
; per the umbrella's consolidated-conf convention.
AutoBrickBrick0 = 512,30,512,495
AutoBrickBrick1 = 512,529,512,995

[Team]
; Two playable teams — freq 0 (left base @ 256,512) and freq 1 (right
; base @ 768,512). FreqManager's MaxFrequency is the NUMBER of public
; frequencies, NOT the highest valid freq number — so 2 means freqs 0
; AND 1 are public, anything past that is private/spec. Read via
; [Team] MaxFrequency (the Subgame-format [Misc] MaxFrequency is dead).
MaxFrequency = 2

[Brick]
; AutoBrick refresh interval. Walls are dropped every (BrickTime - 100ms)
; so they look permanent — pick a value comfortably longer than network
; round-trip but short enough to recover from stragglers if a brick fails
; to render. 12s is the SVS-conventional value. Note: [Brick] is an
; SS.NET-core section, not consolidated under [SectorWar].
BrickTime = 12000
