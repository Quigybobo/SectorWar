; SectorWar floor settings — Hyperspace upgrade-model spine.
;
; Values are 50% of the Devastation cap (settings.conf). Items in later slices
; will close the gap between floor and cap. Tunable.
;
; Reference: docs/SUBSPACE_DAMAGE_MODEL.md — these settings are per-ship-per-player.
; Damage-taken globals (Bullet:BulletDamageLevel etc.) are NOT scaled here yet.

; Phase C: every ship has its own Capital silhouette (ship1.png..ship8.png
; overrides, generated by tools/lvz_warbird_capital.py). All 8 silhouettes
; share the 128×128 canvas convention with a painted max ≈50 from center,
; so Radius=50 is the matching collision floor for every class. Hull Mk.X
; tier addends stack on top per Inventory (Mk.10 → R60, Mk.50 → R100,
; Mk.100 → R150). Capital wings may clip walls by ~10px on each side
; compared to the prior R=14 — that's intentional, matches the silhouette.

[Warbird.Floor]
MaximumEnergy   = 1400
MaximumRecharge = 2100
MaximumThrust   = 15
MaximumSpeed    = 1750
MaximumRotation = 180
BulletSpeed     = 2050
BombSpeed       = 2150
Radius          = 50

