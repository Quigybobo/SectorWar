[Spawn]
; Left vs right two-team layout. With [Team] MaxFrequency=1 only Team0/Team1
; are joinable; Team2/Team3 are unreachable and kept as harmless leftovers.
; Map is 1024x1024; bases sit at the 25% / 75% horizontal marks, vertical
; mid-line. Radius 32 tiles spreads spawns enough to avoid stacking.
;
; KEY FORMAT IS HYPHENATED. SS.NET's ClientSettings module reads `Team0-X`
; (with hyphen) for the client-side spawn-coord settings packet. The
; legacy Subgame `Team0X` form is NOT translated — using it leaves the
; spawn coords at default 0/0 and Continuum spawns players at the
; map origin instead of their team base.
Team0-X=256
Team0-Y=512
Team0-Radius=32
Team1-X=768
Team1-Y=512
Team1-Radius=32
Team2-X=512
Team2-Y=509
Team2-Radius=10
Team3-X=512
Team3-Y=509
Team3-Radius=10
