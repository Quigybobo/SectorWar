; Static-turret types used by the Pylon + StationDeployer infrastructure.
;
; The umbrella consolidates StaticTurret's master settings under [SectorWar]
; with a "StaticTurret" prefix on each key — so the type-list keys are
; StaticTurretTurret0..N (not [StaticTurret] turret0..N as in the original
; standalone module). Per-type sections remain in their own [staticturret_<key>]
; sections; only the master list moved.
;
; NOTE: ASSS conf parser does NOT support inline `;` comments after a value
; on the same line. Comments must be on their own lines. (Inline `;` ends up
; in the parsed value and breaks integer fields.)

[SectorWar]
; Pylon - power source + claim point. Spawned by Pylon module.
StaticTurretTurret0 = pylon
; Outpost gun - 4 corner turrets per outpost.
StaticTurretTurret1 = outpost_gun
; Outpost frigate - 1 heavy escort at the structure center.
StaticTurretTurret2 = outpost_frigate
; WarStation perimeter gun - 8 ring turrets per warstation.
StaticTurretTurret3 = warstation_gun
; WarStation command - 1 heavy bomber at the warstation center.
StaticTurretTurret4 = warstation_command
; HQ perimeter gun - 4 corner turrets per HQ. Auto-spawned by Hq module.
StaticTurretTurret5 = hq_perimeter_gun
; HQ command core - 1 central command per HQ. Heavier than warstation command.
StaticTurretTurret6 = hq_command
; HQ patrolling capital - 1 mobile (warp-patrolling) capital ship per HQ.
StaticTurretTurret7 = hq_capital
; HQ capital mounted bullet cannons - 4 per capital, follow it on warp.
StaticTurretTurret8 = hq_capital_gun
; HQ capital mounted bomb cannons - 2 per capital, follow it on warp.
StaticTurretTurret9 = hq_capital_bomb

[staticturret_pylon]
; Short label "PY" keeps the on-screen player tag tiny so it doesn't
; cover the LVZ visuals. Long form "Pylon" lives in the banner image.
Name = ~PY
; Ship 5 = Terrier (placeholder visual until custom PNG)
Ship = 5
Bounty = 0
; 0 = visible (not cloaked)
Ufo = 0

; LVZ cannon overlay (Phase 5b-C). Image 16 = pylon_node (small power node
; with cyan core, no barrel — matches the pylon's role as a passive emitter).
; Setting this auto-cloaks the bot's ship sprite; only the LVZ shows.
OverlayImageIndex = 16

; HP — ~10 hits to kill at typical bullet damage.
Energy = 2000
Recharge = 200

; Pylons are anti-capital weapons. Slow rotation, slow fire, but each shot
; is a level-3 bomb (~3000 damage) — devastating to large targets like
; Capitals. Fighters get one-shot but have mobility to dodge.
; WeaponType: 2 = bomb
WeaponType = 2
; Max bomb level for max damage.
WeaponLevel = 3
; 4 sec between shots — intentionally slow.
WeaponDelay = 400
WeaponFireEnergy = 0
; 30-tile detection range.
WeaponSightPixels = 480

; Slow rotation — pylons are hard to keep aim with; mobile ships can juke.
RotationSpeed = 80
Timeout = 99999

; No respawn (one-shot deploy).
RespawnDelay = 0
RespawnCount = 1
DoBuildSequence = 0

; Pylons themselves require no power (they ARE the power source).
RequiredPower = 0

; Show on radar so enemies can find + kill them.
XRadar = 1

; Arena-wide cap; per-player cap enforced by Pylon module later.
MaxBots = 50

[staticturret_outpost_gun]
; Light combat turret. 4 corner units per outpost.
Name = ~OG
; Ship 4 = Leviathan (substantial-looking placeholder)
Ship = 4
Bounty = 0
Ufo = 0

; LVZ cannon — image 17 = standard single-fire turret with bone barrel.
OverlayImageIndex = 17

; HP — moderate; ~5-10 bullet hits to bring down.
Energy = 1500
Recharge = 200

; Weapon — level-2 bullets, fast fire rate.
; WeaponType: 1 = bullet
WeaponType = 1
WeaponLevel = 2
; 500ms between shots.
WeaponDelay = 50
WeaponFireEnergy = 0
; 50-tile detection range — long-range AA cover.
WeaponSightPixels = 800

; Quick aim — outposts are responsive.
RotationSpeed = 240
Timeout = 99999

RespawnDelay = 0
RespawnCount = 1
DoBuildSequence = 0

; Outpost guns require freq-power. Pylon module calls SetPower with the
; pylon-count when pylons deploy/despawn. Once all friendly pylons die,
; RequiredPower (1) > Power (0) and these turrets stop firing.
RequiredPower = 1

XRadar = 1
MaxBots = 200

[staticturret_outpost_frigate]
; Heavier defender at the structure center. Phase 2.5 = stationary;
; Phase 2.5b will add patrol orbit.
Name = ~OF
; Ship 6 = Lancaster — visibly larger than the OutpostGun's Levi.
Ship = 6
Bounty = 0
Ufo = 0

; LVZ cannon — image 19 = twin-barrel mount (heavier than outpost_gun).
OverlayImageIndex = 19

; HP — beefy. Takes ~25 player bullet hits to bring down.
Energy = 4000
Recharge = 250

; Weapon — bomb level 2 (medium-heavy). 1.5s fire rate.
; WeaponType: 2 = bomb
WeaponType = 2
WeaponLevel = 2
; 1500ms — slower than the gun, hits harder.
WeaponDelay = 150
WeaponFireEnergy = 0
; 60-tile sight.
WeaponSightPixels = 960

RotationSpeed = 180
Timeout = 99999

RespawnDelay = 0
RespawnCount = 1
DoBuildSequence = 0

; Frigates also need pylon power so they go inert when pylons die.
RequiredPower = 1

XRadar = 1
MaxBots = 100

[staticturret_warstation_gun]
; Fortress perimeter gun. 8 ring turrets per warstation. Stronger and
; higher-power-tier than outpost_gun.
Name = ~WG
; Ship 4 = Leviathan
Ship = 4
Bounty = 0
Ufo = 0

; LVZ cannon — image 18 = beefier single-fire mount with side rivets.
OverlayImageIndex = 18

; HP - tougher than outpost_gun (~12 player bullet hits to bring down).
Energy = 2500
Recharge = 250

; Weapon - level-3 bullets, 400ms fire rate.
WeaponType = 1
WeaponLevel = 3
WeaponDelay = 40
WeaponFireEnergy = 0
; 96-tile sight — bumped from 64 to give warstations real reach into enemy
; territory; pairs with HQ capital's damage-hold so engagements resolve
; instead of the capital warping out at the edge of vision.
WeaponSightPixels = 1536

RotationSpeed = 260
Timeout = 99999

RespawnDelay = 0
RespawnCount = 1
DoBuildSequence = 0

; Requires 2 pylons. WarStations are network-investment structures.
RequiredPower = 2

XRadar = 1
MaxBots = 200

; ===========================================================================
; HQ defenders (auto-spawned per team by SectorWar.Hq.cs)
; ===========================================================================
; HQ turrets are PERMANENT per-team fortifications: RequiredPower=0 so they
; don't depend on player-deployed pylons, RespawnCount=0 (infinite respawns)
; for the perimeter + command, and tougher stats than warstation. The capital
; uses module-driven respawn (RespawnCount=1) — SectorWar.Hq.cs handles
; teleport-on-patrol and respawn-after-kill.

[staticturret_hq_perimeter_gun]
; Bigger brother of warstation_gun. Persistent base defender — tank stats,
; level-3 bullets, fast cadence. 4 per HQ.
Name = ~HG
; Ship 4 = Leviathan
Ship = 4
Bounty = 0
Ufo = 0

; Reuse warstation_gun's beefy turret cannon overlay (image 18).
OverlayImageIndex = 18

; HP — ~15 player bullet hits to bring down. Tougher than warstation_gun.
Energy = 3000
Recharge = 300

; Weapon — level-3 bullets, ~350ms cadence (faster than warstation_gun).
WeaponType = 1
WeaponLevel = 3
WeaponDelay = 35
WeaponFireEnergy = 0
; 64-tile sight matches warstation_gun.
WeaponSightPixels = 1024

RotationSpeed = 280
Timeout = 99999

; Auto-respawn 30s after death — HQs are permanent fortifications.
RespawnDelay = 3000
RespawnCount = 0
DoBuildSequence = 0

; HQs always operate (no pylon dependency).
RequiredPower = 0

XRadar = 1
MaxBots = 200

[staticturret_hq_command]
; HQ command core. Beefier than warstation_command — the team's anchor.
Name = ~HC
; Ship 6 = Lancaster
Ship = 6
Bounty = 0
Ufo = 0

; Reuse warstation_command's fortress overlay (image 20).
OverlayImageIndex = 20

; HP — tank. ~60 player bullet hits.
Energy = 10000
Recharge = 350

; Weapon — bomb level 3, 1.0s cadence.
WeaponType = 2
WeaponLevel = 3
WeaponDelay = 100
WeaponFireEnergy = 0
; 80-tile sight (matches warstation_command).
WeaponSightPixels = 1280

RotationSpeed = 200
Timeout = 99999

RespawnDelay = 6000
RespawnCount = 0
DoBuildSequence = 0

RequiredPower = 0

XRadar = 1
MaxBots = 50

[staticturret_hq_capital]
; Patrolling capital ship — module-driven (SectorWar.Hq.cs warps it among
; four corners). Ship sprite is VISIBLE (no OverlayImageIndex). The custom
; Lancaster Capital art (ship7.png in sectorwar.lvz) overrides the default
; Lancaster sprite, so this bot renders with the angular Capital silhouette.
Name = ~HQ
; Ship is 1-BASED in conf (StaticTurret subtracts 1 → enum index). Lancaster
; conf-value = 7. (Ship=6 maps to Weasel, which is what was rendering before
; this was fixed.)
Ship = 7
Bounty = 0
Ufo = 0

; OverlayImageIndex omitted — defaults to -1, ship sprite is visible.

; HP — major tank. The capital is the round-ender so it should require a
; sustained assault. With Recharge=400 (40 energy/sec) and level-3 bullet
; damage ~70/hit, you need ~10+ hits/sec sustained to actually whittle it
; down — perfect for "warstation barrage from outside the proximity ring".
Energy = 50000
Recharge = 400

; Weapon — bomb level 3, 800ms cadence (faster than command core).
WeaponType = 2
WeaponLevel = 3
WeaponDelay = 80
WeaponFireEnergy = 0
WeaponSightPixels = 1024

RotationSpeed = 220
Timeout = 99999

; Hitbox size — must match the painted Lancaster-Capital silhouette
; (~50 px radius, see [Lancaster.Floor] Radius=50 in floor.conf). Default
; is 14 which matches a vanilla Lancaster, NOT the oversized capital
; sprite. With the default, bullets that visually hit the painted hull
; pass straight through if they're more than 14 px from center.
ShipRadius = 50

; RespawnCount=1 — one life, then SectorWar.Hq.cs handles respawn cycle
; (HqCapitalRespawnDelaySeconds in arena.conf).
RespawnDelay = 0
RespawnCount = 1
DoBuildSequence = 0

RequiredPower = 0

XRadar = 1
MaxBots = 10

[staticturret_warstation_command]
; Fortress command core - 1 per warstation, sits at the structure center.
; Heavy bomber that anchors the formation.
Name = ~WC
; Ship 6 = Lancaster (matches outpost_frigate visual class but stronger stats)
Ship = 6
Bounty = 0
Ufo = 0

; LVZ cannon — image 20 = largest fortress turret with red command marker.
; Visually the heart of a WarStation; pairs with the baseplate's bullseye.
OverlayImageIndex = 20

; HP - tank. ~50 player bullet hits to bring down.
Energy = 8000
Recharge = 300

; Weapon - bomb level 3, slow but devastating. 1.2s fire rate.
WeaponType = 2
WeaponLevel = 3
WeaponDelay = 120
WeaponFireEnergy = 0
; 80-tile sight - longest range in the deployable line-up.
WeaponSightPixels = 1280

RotationSpeed = 180
Timeout = 99999

RespawnDelay = 0
RespawnCount = 1
DoBuildSequence = 0

; Highest power requirement - needs a 3-pylon network to operate.
RequiredPower = 3

XRadar = 1
MaxBots = 50

; ===========================================================================
; HQ Capital mounted cannons — spawn/move/die WITH the capital.
