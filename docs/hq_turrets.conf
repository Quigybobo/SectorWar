; =============================================================================
; HQ turret definitions — REFERENCE for the Nexus website's "Add Turret" UI.
; -----------------------------------------------------------------------------
; These 5 turret-type names are HARDCODED by SectorWar.Hq.cs (constants
; HqPerimeterGunKey, HqCommandKey, HqCapitalKey, HqCapitalCannonGunKey,
; HqCapitalCannonBombKey). Names MUST match exactly.
;
; The plugin (not the website) handles HQ SPAWNS — Hq.cs reads the per-team
; HQ center from [Spawn] Team{Freq}-X / Team{Freq}-Y and auto-spawns the
; formation on arena Create. DO NOT add StaticTurretSpawn* entries for hq_*
; types or the plugin will double-spawn.
;
; Stat values below are copied VERBATIM from the canonical structures.conf
; in the SectorWar repo (arenas/sectorwar/structures.conf). When in doubt,
; that file is the source of truth.
;
; FORMATION (per HQ, auto-spawned by Hq.cs at the team's [Spawn] Team{N}-X/Y):
;   1× hq_command          at center
;   4× hq_perimeter_gun    at corners (±96 px from center)
;   1× hq_capital          patrols 4 corners (±256 px outside the gun ring)
;   4× hq_capital_gun      mounted on capital (bullet cannons)
;   2× hq_capital_bomb     mounted on capital (bomb cannons)
; =============================================================================


; -----------------------------------------------------------------------------
; [staticturret_hq_perimeter_gun] — 4 corner guns per HQ
; Bigger brother of warstation_gun. Persistent base defender — tank stats,
; level-3 bullets, fast cadence.
; -----------------------------------------------------------------------------
[staticturret_hq_perimeter_gun]
Name              = ~HG
Ship              = 4                 ; Leviathan (1-based)
ShipRadius        = 14
OverlayImageIndex = 108               ; reuses warstation_gun's 40-frame rotation set
Energy            = 3000              ; ~15 player bullet hits to kill
Recharge          = 300
WeaponType        = 1                 ; Bullet
WeaponLevel       = 3                 ; 1-based
WeaponDelay       = 35                ; ~350ms cadence
WeaponFireEnergy  = 0
WeaponSightPixels = 1024              ; 64 tiles
RotationSpeed     = 280
Timeout           = 99999
RespawnDelay      = 3000              ; 30s
RespawnCount      = 0                 ; 0 = infinite respawn
RequiredPower     = 0                 ; HQs always operate (no pylon dependency)
XRadar            = 1
Ufo               = 0
MaxBots           = 200
DoBuildSequence   = 0


; -----------------------------------------------------------------------------
; [staticturret_hq_command] — 1 command core per HQ (at center)
; The team's anchor. Beefier than warstation_command.
; -----------------------------------------------------------------------------
[staticturret_hq_command]
Name              = ~HC
Ship              = 6                 ; Lancaster (1-based: WB=1..Shark=8)
ShipRadius        = 14
OverlayImageIndex = 148               ; reuses warstation_command's 40-frame rotation set
Energy            = 10000             ; ~60 player bullet hits to kill (tank)
Recharge          = 350
WeaponType        = 3                 ; Bomb (canonical SubSpace code; 2 is BounceBullet)
WeaponLevel       = 3
WeaponDelay       = 100               ; 1.0s cadence
WeaponFireEnergy  = 0
WeaponSightPixels = 1280              ; 80 tiles (longest range)
RotationSpeed     = 200
Timeout           = 99999
RespawnDelay      = 6000              ; 60s
RespawnCount      = 0
RequiredPower     = 0
XRadar            = 1
Ufo               = 0
MaxBots           = 50
DoBuildSequence   = 0


; -----------------------------------------------------------------------------
; [staticturret_hq_capital] — 1 patrolling capital ship per HQ
; ⚠️ TWO IMPORTANT QUIRKS:
;   1. Ship MUST be 7 (Lancaster slot), NOT 6. Ship=6 maps to Weasel in 1-based
;      indexing (StaticTurret subtracts 1 → ShipType.Weasel). Ship=7 = Lancaster,
;      which is the slot the custom capital sprite (ship7.png in sectorwar.lvz)
;      overrides.
;   2. ShipRadius MUST be 50 (custom hitbox matching the painted capital
;      silhouette). Default 14 makes bullets pass through the visible hull.
;   3. NO OverlayImageIndex — ship sprite is VISIBLE (the ship7.png override).
; -----------------------------------------------------------------------------
[staticturret_hq_capital]
Name              = ~HQ
Ship              = 7                 ; Lancaster (1-based) — NOT 6
ShipRadius        = 50                ; custom hitbox for painted silhouette
; OverlayImageIndex omitted — ship sprite stays visible (ship7.png override)
Energy            = 50000             ; major tank — round-ender
Recharge          = 400               ; 40 energy/sec
WeaponType        = 3                 ; Bomb (canonical SubSpace code; 2 is BounceBullet)
WeaponLevel       = 3
WeaponDelay       = 80                ; 800ms cadence (faster than command core)
WeaponFireEnergy  = 0
WeaponSightPixels = 1024              ; 64 tiles
RotationSpeed     = 220
Timeout           = 99999
RespawnDelay      = 0                 ; one life — Hq.cs handles respawn cycle
RespawnCount      = 1
RequiredPower     = 0
XRadar            = 1
Ufo               = 0
; MaxBots intentionally omitted (defaults to -1 = no cap)
DoBuildSequence   = 0


; -----------------------------------------------------------------------------
; [staticturret_hq_capital_gun] — 4 bullet cannons mounted on the capital
; (port-fore, starboard-fore, port-aft, starboard-aft positions)
; Invisible bot under the cannon LVZ overlay.
; -----------------------------------------------------------------------------
[staticturret_hq_capital_gun]
Name              = ~HQC
Ship              = 4                 ; Leviathan (invisible — overlay covers it)
ShipRadius        = 14
OverlayImageIndex = 28                ; 40-frame rotation atlas starting at image 28
Energy            = 1500
Recharge          = 200
WeaponType        = 1                 ; Bullet
WeaponLevel       = 2
WeaponDelay       = 50
WeaponFireEnergy  = 0
WeaponSightPixels = 1024
RotationSpeed     = 280
Timeout           = 99999
RespawnDelay      = 0
RespawnCount      = 1
RequiredPower     = 0
XRadar            = 1
Ufo               = 0
MaxBots           = 50
DoBuildSequence   = 0


; -----------------------------------------------------------------------------
; [staticturret_hq_capital_bomb] — 2 bomb cannons mounted on the capital
; (fore + aft positions). Heavier barrel + orange charge tip in the LVZ.
; -----------------------------------------------------------------------------
[staticturret_hq_capital_bomb]
Name              = ~HQB
Ship              = 4                 ; Leviathan
ShipRadius        = 14
OverlayImageIndex = 68                ; 40-frame rotation atlas starting at image 68
Energy            = 2000
Recharge          = 250
WeaponType        = 3                 ; Bomb (canonical SubSpace code; 2 is BounceBullet)
WeaponLevel       = 2
WeaponDelay       = 100
WeaponFireEnergy  = 0
WeaponSightPixels = 1280
RotationSpeed     = 240
Timeout           = 99999
RespawnDelay      = 0
RespawnCount      = 1
RequiredPower     = 0
XRadar            = 1
Ufo               = 0
MaxBots           = 30
DoBuildSequence   = 0
